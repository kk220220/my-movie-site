<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>我的影视库</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0d12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(11,13,18,.94);backdrop-filter:blur(12px);padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:22px;font-weight:800}
.search{margin-top:14px;width:100%;border:1px solid #252a35;background:#171a22;color:#fff;border-radius:12px;padding:13px 15px;font-size:15px;outline:none}
nav{display:flex;gap:8px;overflow:auto;padding:14px 16px 4px}
nav button{white-space:nowrap;border:0;border-radius:20px;background:#191d26;color:#aaa;padding:9px 15px}
nav button.active{background:#fff;color:#111}
main{padding:12px 16px 90px}
h2{font-size:19px;margin:20px 0 13px}
.hero{height:220px;border-radius:18px;padding:20px;display:flex;align-items:end;background:linear-gradient(0deg,rgba(0,0,0,.85),rgba(0,0,0,.1)),linear-gradient(135deg,#343b55,#151821);box-shadow:0 8px 30px rgba(0,0,0,.3)}
.hero h1{margin:0 0 7px;font-size:27px}
.hero p{margin:0;color:#bbb;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{background:#151820;border-radius:14px;overflow:hidden}
.poster{aspect-ratio:2/3;background:linear-gradient(145deg,#353b4c,#191c25);display:flex;align-items:center;justify-content:center;color:#777;font-size:34px}
.info{padding:11px}
.title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:#8e94a3;font-size:12px;margin-top:5px}
.play{display:block;margin-top:9px;width:100%;border:0;border-radius:9px;padding:8px;background:#fff;color:#111;font-weight:700}
.empty{padding:40px 15px;text-align:center;color:#777;display:none}
footer{position:fixed;bottom:0;left:0;right:0;background:rgba(14,16,22,.96);border-top:1px solid #222631;display:flex;justify-content:space-around;padding:11px 0 calc(11px + env(safe-area-inset-bottom));z-index:20}
footer div{text-align:center;color:#858b99;font-size:11px}
footer .on{color:#fff}
.icon{font-size:20px;display:block;margin-bottom:2px}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo">🎬 我的影视库</div>
    <div>⋯</div>
  </div>
  <input id="search" class="search" placeholder="搜索电影、电视剧..." oninput="filterMovies()">
</header>

<nav>
  <button class="active" onclick="setCat('全部',this)">全部</button>
  <button onclick="setCat('电影',this)">电影</button>
  <button onclick="setCat('电视剧',this)">电视剧</button>
  <button onclick="setCat('动画',this)">动画</button>
</nav>

<main>
  <section class="hero">
    <div>
      <h1>欢迎来到我的影视库</h1>
      <p>手机、平板、电脑均可访问</p>
    </div>
  </section>

  <h2>🔥 热门推荐</h2>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty">没有找到相关影视</div>
</main>

<footer>
  <div class="on"><span class="icon">⌂</span>首页</div>
  <div><span class="icon">▣</span>电影</div>
  <div><span class="icon">▤</span>电视剧</div>
  <div><span class="icon">♡</span>收藏</div>
  <div><span class="icon">⚙</span>设置</div>
</footer>

<script>
const movies=[
 {title:"星际探索",type:"电影",year:"2026",emoji:"🚀"},
 {title:"暗夜之城",type:"电视剧",year:"2026",emoji:"🌃"},
 {title:"最后的旅程",type:"电影",year:"2025",emoji:"🏔️"},
 {title:"未来世界",type:"动画",year:"2026",emoji:"🤖"},
 {title:"深海行动",type:"电影",year:"2025",emoji:"🌊"},
 {title:"时间边缘",type:"电视剧",year:"2026",emoji:"⏳"}
];
let category="全部";

function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=movies.filter(m=>
   (category==="全部"||m.type===category)&&
   m.title.toLowerCase().includes(q)
 );
 const grid=document.getElementById("grid");
 const empty=document.getElementById("empty");
 grid.innerHTML=list.map(m=>`
   <div class="card">
     <div class="poster">${m.emoji}</div>
     <div class="info">
       <div class="title">${m.title}</div>
       <div class="meta">${m.year} · ${m.type}</div>
       <button class="play" onclick="alert('播放器页面将在下一版接入')">▶ 播放</button>
     </div>
   </div>`).join("");
 empty.style.display=list.length?"none":"block";
}
function setCat(c,btn){
 category=c;
 document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
 render();
}
function filterMovies(){render()}
render();
</script>
</body>
</html>
